<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Hosting Plans</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="decor-circle"></div>
    <h1 class="title">Select Your Server Node</h1>

    <div class="card-container">
        
        <div class="card card-1">
            <h2>Micro Node</h2>
            <ul class="descrpt">
                <li>vCPU: 2 Cores</li>
                <li>RAM: 4 GB ECC</li>
                <li>Storage: 80 GB NVMe</li>
            </ul>
            <div class="price">$15/mo</div>
            <button class="card-btn">More details</button>
        </div>

        <div class="card card-2">
            <h2>Pro Node</h2>
            <ul class="descrpt">
                <li>vCPU: 8 Cores</li>
                <li>RAM: 32 GB ECC</li>
                <li>Storage: 500 GB NVMe</li>
            </ul>
            <div class="price">$45/mo</div>
            <button class="card-btn">More details</button>
        </div>

        <div class="card card-3">
            <h2>Max Node</h2>
            <ul class="descrpt">
                <li>vCPU: 32 Cores</li>
                <li>RAM: 128 GB ECC</li>
                <li>Storage: 2 TB NVMe</li>
            </ul>
            <div class="price">$120/mo</div>
            <button class="card-btn">More details</button>
        </div>
    </div>
</body>
</html>
